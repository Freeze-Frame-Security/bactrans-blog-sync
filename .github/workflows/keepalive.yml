name: Keepalive

# GitHub auto-disables *scheduled* workflows after 60 days without repository
# activity (a push/commit to this repo) — see sync.yml, which was silently
# disabled on 2026-08-04 for exactly this reason. sync.yml never pushes to
# THIS repo (it only pushes generated content into bactrans-site), so nothing
# here ever reset that inactivity clock and the hourly blog sync stayed dark
# for a month before anyone noticed.
#
# This workflow makes one trivial monthly commit to this repo so GitHub sees
# real activity and never auto-disables sync.yml's schedule again.

on:
  schedule:
    - cron: '0 0 1 * *'   # 00:00 UTC on the 1st of each month
  workflow_dispatch: {}

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Touch heartbeat file
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/.heartbeat

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain .github/.heartbeat)" ]]; then
            git config user.name  "bac-blog-sync[bot]"
            git config user.email "bac-blog-sync@users.noreply.github.com"
            git add .github/.heartbeat
            git commit -m "chore: keepalive heartbeat (prevents scheduled-workflow auto-disable)"
            git push
          else
            echo "No change."
          fi
